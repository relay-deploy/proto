syntax = "proto3";

package relay.platform.v1;

import "google/protobuf/timestamp.proto";
import "relay/common/v1/resources.proto";

message App {
  string id = 1;
  string project_id = 2;
  string name = 3;
  AppSpec spec = 4;
  AppStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AppSpec {
  AppSource source = 1;
  Exposure exposure = 2;
  relay.common.v1.Resources resources = 3;
}

message AppSource {
  oneof kind {
    ImageSource image = 1;
  }
}

message ImageSource {
  string reference = 1;
}

message Exposure {
  uint32 port = 1;
  string subdomain = 2;
}

message AppStatus {
  AppPhase phase = 1;
  string current_release_id = 2;
  google.protobuf.Timestamp observed_at = 3;
}

enum AppPhase {
  APP_PHASE_UNSPECIFIED = 0;
  APP_PHASE_NOT_DEPLOYED = 1;
  APP_PHASE_DEPLOYING = 2;
  APP_PHASE_RUNNING = 3;
  APP_PHASE_STOPPED = 4;
  APP_PHASE_CRASHED = 5;
}
